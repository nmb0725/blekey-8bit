<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<title>BLEKey Config</title>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<style>
*{box-sizing:border-box}
body{font-family:sans-serif;padding:16px;background:#111;color:#eee;max-width:600px;margin:0 auto}
h1{color:#58a6ff;font-size:20px;margin:0 0 16px}
h2{color:#58a6ff;font-size:15px;margin:16px 0 8px;border-bottom:1px solid #333;padding-bottom:4px}
label{display:block;font-size:12px;color:#888;margin:6px 0 2px}
.row{display:flex;gap:6px;margin:4px 0;align-items:center}
.row input,.row select{padding:5px;background:#222;border:1px solid #333;color:#eee;border-radius:3px}
.row input[type=number]{width:64px}
.row select{flex:1}
.row .edit-btn{padding:4px 8px;background:#222;border:1px solid #333;color:#58a6ff;border-radius:3px;cursor:pointer;font-size:14px;text-decoration:none;line-height:1}
.row .edit-btn:hover{background:#333}
input[type=text],input[type=number],input[type=password]{width:100%;padding:5px;background:#222;border:1px solid #333;color:#eee;border-radius:3px}
.pw-wrap{display:flex;gap:4px;align-items:center}
.pw-wrap input{flex:1}
.pw-toggle{padding:4px 8px;background:#222;border:1px solid #333;color:#888;border-radius:3px;cursor:pointer;font-size:13px;white-space:nowrap}
.pw-toggle:hover{background:#333;color:#eee}
.actions{margin-top:16px;display:flex;gap:8px}
.btn{padding:8px 20px;border:none;border-radius:4px;cursor:pointer;font-size:14px}
.btn:hover{opacity:0.9}
.btn-save{background:#238636;color:#fff}
.btn-save:hover{background:#2ea043}
.btn-reboot{background:#d32f2f;color:#fff}
.btn-reboot:hover{background:#f44336}
#msg{padding:8px;margin:8px 0;border-radius:4px;display:none;font-size:13px}
#msg.ok{display:block;background:#23863633;border:1px solid #238636;color:#3fb950}
#msg.err{display:block;background:#d32f2f33;border:1px solid #d32f2f;color:#ff5252}
.row .btn-label{flex:0 0 64px;font-size:12px;color:#888}
.row .edit-btn[disabled]{opacity:0.3;cursor:not-allowed}
.row .edit-btn[disabled]:hover{background:#222}
.row input.bad,#trigger.bad,#longpress.bad,#webport.bad{border-color:#d32f2f;box-shadow:0 0 0 1px #d32f2f}
.row input.good,#trigger.good,#longpress.good,#webport.good{border-color:#238636}
.btn[disabled]{opacity:0.6;cursor:not-allowed}
</style>
</head>
<body>
<h1>BLEKey-8bit Config</h1>
<p id="ip" style="color:#888;font-size:13px">IP: --</p>
<div id='msg'></div>
<h2>Buttons</h2>
<div id='btns'></div>
<h2>System</h2>
<label>Trigger Pins (comma separated)</label>
<input id='trigger' type='text' placeholder='e.g. 0,1'>
<label>Long Press (ms)</label>
<input id='longpress' type='number' placeholder='3000'>
<label>Web Host</label>
<input id='webhost' type='text' placeholder='0.0.0.0'>
<label>Web Port</label>
<input id='webport' type='number' placeholder='80'>
<h2>WiFi</h2>
<label>WiFi SSID</label>
<input id='wifissid' type='text' placeholder='e.g. MyWiFi'>
<label>WiFi Password</label>
<div class="pw-wrap">
<input id='wifipw' type='password' placeholder='e.g. password'>
<button class="pw-toggle" onclick="togglePw()" id="pwbtn">Show</button>
</div>
<div class='actions'>
<button class='btn btn-save' onclick='save()'>Save</button>
<button class='btn btn-reboot' onclick='reboot()'>Save &amp; Reboot</button>
</div>
<script>
var M=[];
var S=null;
var dirty=false;
var msgTimer=null;
var saveBtn=document.querySelector('.btn-save');
var rebootBtn=document.querySelector('.btn-reboot');
function apiFetch(url,opts,noJson){
  opts=opts||{};
  return new Promise(function(res,rej){
    var t=setTimeout(function(){rej(new Error('Timeout'))},8000);
    fetch(url,opts).then(function(r){
      clearTimeout(t);
      if(!r.ok)throw new Error('HTTP '+r.status);
      return noJson?r:r.json();
    }).then(res).catch(function(e){clearTimeout(t);rej(e);});
  });
}
function msg(t,c){
  var e=document.getElementById('msg');e.className=c;e.textContent=t;
  if(msgTimer){clearTimeout(msgTimer);msgTimer=null;}
  if(c==='ok'){msgTimer=setTimeout(function(){e.className='';e.textContent='';},3000);}
}
function markDirty(){dirty=true;}
function attachDirty(){
  var els=document.querySelectorAll('#btns input,#btns select,#trigger,#longpress,#webhost,#webport,#wifissid,#wifipw');
  for(var i=0;i<els.length;i++)els[i].addEventListener('change',markDirty);
}
function setBusy(b){
  saveBtn.disabled=b;rebootBtn.disabled=b;
  saveBtn.textContent=b?'Saving...':'Save';
  rebootBtn.textContent=b?'Saving...':'Save & Reboot';
}
apiFetch('/api/settings').then(function(d){
  M=d.macros;S=d.settings;
  document.getElementById('ip').textContent='IP: '+(d.ip||'--');
  render();attachDirty();
}).catch(function(e){msg('Load failed: '+e.message,'err');});
function render(){
  var s=S,h='';
  s.button_configs.forEach(function(c,i){
    h+='<div class="row"><span class="btn-label">Button '+(i+1)+'</span>';
    h+='<input id="p'+i+'" type="number" value="'+c.pin+'">';
    h+='<select id="m'+i+'" onchange="onMacroChange('+i+')">';
    M.forEach(function(n){h+='<option'+(n==c.macro?' selected':'')+'>'+n+'</option>'});
    h+='</select>';
    h+='<button class="edit-btn" id="e'+i+'" onclick="gotoEditor('+i+')">\u270e</button></div>';
  });
  document.getElementById('btns').innerHTML=h;
  for(var i=0;i<s.button_configs.length;i++)updateEditBtn(i);
  document.getElementById('trigger').value=s.trigger_pins.join(',');
  document.getElementById('longpress').value=s.long_press_ms;
  document.getElementById('webhost').value=s.web_host||'0.0.0.0';
  document.getElementById('webport').value=s.web_port||80;
  document.getElementById('wifissid').value=s.wifi_ssid||'';
  document.getElementById('wifipw').value=s.wifi_password||'';
  dirty=false;
}
function updateEditBtn(i){
  var sel=document.getElementById('m'+i),btn=document.getElementById('e'+i);
  if(!sel||!btn)return;
  if(sel.value==='DISABLED'){btn.disabled=true;btn.title='Enable a macro first';}
  else{btn.disabled=false;btn.title='Edit macro';}
}
function onMacroChange(i){updateEditBtn(i);markDirty();}
function gotoEditor(i){
  if(dirty&&!confirm('Unsaved changes, leave anyway?'))return;
  location.href='/editor?index='+i;
}
function isUInt(v){return /^\d+$/.test(String(v).trim());}
function checkNum(id,label,min,max){
  var el=document.getElementById(id),v=el.value.trim(),good=isUInt(v);
  if(good){var x=+v;if(x<min||(max!=null&&x>max))good=false;}
  el.classList.toggle('bad',!good);el.classList.toggle('good',good);
  return good?null:label+': invalid value';
}
function validate(){
  var ok=true,err=null;
  var n=document.querySelectorAll('#btns .row').length;
  for(var i=0;i<n;i++){
    var p=document.getElementById('p'+i),v=p.value.trim();
    var good=v!==''&&isUInt(v);
    p.classList.toggle('bad',!good);p.classList.toggle('good',good);
    if(!good){ok=false;if(err===null)err='Button '+(i+1)+': invalid pin';}
  }
  var tp=document.getElementById('trigger'),parts=tp.value.split(','),clean=[],tbad=false;
  for(var j=0;j<parts.length;j++){var t=parts[j].trim();if(t==='')continue;if(!isUInt(t)){tbad=true;break;}clean.push(t);}
  var tog=!tbad&&clean.length>0;
  tp.classList.toggle('bad',!tog);tp.classList.toggle('good',tog);
  if(!tog){ok=false;if(err===null)err=tbad?'Trigger Pins: invalid value':'Trigger Pins: at least one required';}
  var e2=checkNum('longpress','Long Press (ms)',1,null);if(e2){ok=false;if(err===null)err=e2;}
  var e3=checkNum('webport','Web Port',1,65535);if(e3){ok=false;if(err===null)err=e3;}
  if(!ok)msg(err||'Invalid input','err');
  return ok;
}
function getCfg(){
  var a=[],n=document.querySelectorAll('#btns .row').length;
  for(var i=0;i<n;i++){
    a.push({pin:+document.getElementById('p'+i).value,macro:document.getElementById('m'+i).value,custom_events:null});
  }
  return{button_configs:a,trigger_pins:document.getElementById('trigger').value.split(',').map(function(x){return x.trim()}).filter(function(x){return x!==''}).map(Number),long_press_ms:+document.getElementById('longpress').value,web_host:document.getElementById('webhost').value,web_port:+document.getElementById('webport').value,wifi_ssid:document.getElementById('wifissid').value,wifi_password:document.getElementById('wifipw').value};
}
function togglePw(){
  var pw=document.getElementById('wifipw');
  var btn=document.getElementById('pwbtn');
  if(pw.type=='password'){
    pw.type='text';
    btn.textContent='Hide';
  }else{
    pw.type='password';
    btn.textContent='Show';
  }
}
function save(){
  if(!validate())return;
  setBusy(true);
  apiFetch('/api/settings',{method:'POST',body:JSON.stringify(getCfg())}).then(function(d){
    if(!d||d.ok===false)throw new Error('Save rejected by device');
    msg('Saved OK','ok');dirty=false;
  }).catch(function(e){msg('Error: '+e.message,'err');})
  .then(function(){setBusy(false);});
}
function reboot(){
  if(!validate())return;
  setBusy(true);
  apiFetch('/api/settings',{method:'POST',body:JSON.stringify(getCfg())}).then(function(d){
    if(!d||d.ok===false)throw new Error('save');
    dirty=false;
    msg('Rebooting, waiting for device\u2026','ok');
    return apiFetch('/api/reboot',{method:'POST'},true).catch(function(){});
  }).then(function(){pollDevice();})
  .catch(function(e){
    if(e&&e.message==='save')msg('Save failed, reboot aborted','err');
    else msg('Error: '+(e&&e.message),'err');
    setBusy(false);
  });
}
function pollDevice(){
  var start=Date.now();
  var iv=setInterval(function(){
    apiFetch('/api/settings',{},true).then(function(){
      clearInterval(iv);msg('Device is back','ok');
      setTimeout(function(){location.reload();},1000);
    }).catch(function(){
      if(Date.now()-start>60000){clearInterval(iv);msg('Device not reachable after 60s, check the IP and refresh manually','err');setBusy(false);}
    });
  },2000);
}
window.onbeforeunload=function(){if(dirty)return 'Unsaved changes';};
</script>
</body>
</html>
